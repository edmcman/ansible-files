---
- name: Enable i386 architecture in dpkg
  lineinfile:
    dest: '/var/lib/dpkg/arch'
    line: i386
  notify: Apt update

- name: Download WineHQ key
  ansible.builtin.get_url:
    url: https://dl.winehq.org/wine-builds/winehq.key
    dest: /usr/share/keyrings/winehq.asc
    mode: '0644'

- name: Remove unscoped WineHQ repository
  ansible.builtin.apt_repository:
    repo: "deb http://dl.winehq.org/wine-builds/ubuntu/ {{ ansible_distribution_release }} main"
    state: absent
    update_cache: false

- name: Add WineHQ repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/winehq.asc] http://dl.winehq.org/wine-builds/ubuntu/ {{ ansible_distribution_release }} main"
    state: present
  notify: Apt update

- name: Flush handlers
  meta: flush_handlers
  
- name: Install winehq-stable
  apt:
    name: winehq-stable
    state: present
    install_recommends: yes

- name: Install other packages
  apt:
    name:
      - winetricks
