---
- name: Check enabled foreign architectures
  ansible.builtin.command: dpkg --print-foreign-architectures
  register: foreign_architectures
  changed_when: false
  check_mode: false

- name: Enable i386 architecture in dpkg
  ansible.builtin.command: dpkg --add-architecture i386
  when: "'i386' not in foreign_architectures.stdout_lines"
  notify: Apt update

- name: Download WineHQ key
  ansible.builtin.get_url:
    url: https://dl.winehq.org/wine-builds/winehq.key
    dest: /usr/share/keyrings/winehq.asc
    mode: '0644'

- name: Remove unscoped WineHQ repository
  ansible.builtin.apt_repository:
    repo: "deb http://dl.winehq.org/wine-builds/ubuntu/ {{ ansible_distribution_release }} main"
    state: absent
    update_cache: false

- name: Add WineHQ repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/winehq.asc] http://dl.winehq.org/wine-builds/ubuntu/ {{ ansible_distribution_release }} main"
    state: present
  notify: Apt update

- name: Flush handlers
  meta: flush_handlers
  
- name: Install winehq-stable
  apt:
    name: winehq-stable
    state: present
    install_recommends: yes

- name: Install other packages
  apt:
    name:
      - winetricks
