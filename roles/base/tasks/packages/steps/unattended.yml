- name: Install unattended upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable periodic unattended upgrades
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/20auto-upgrades
    regexp: '^{{ item }}\s'
    line: '{{ item }} "1";'
    create: true
    mode: '0644'
  loop:
    - APT::Periodic::Update-Package-Lists
    - APT::Periodic::Unattended-Upgrade

- name: Allow updates from configured repositories
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51unattended-repositories
    mode: '0644'
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=${distro_id},archive=${distro_codename}-updates";
          "site=apt.llvm.org";
          "site=apt.releases.hashicorp.com";
          "site=cli.github.com";
          "site=cloud.r-project.org";
          "site=deb.packages.mattermost.com";
          "site=dl.google.com";
          "site=dl.winehq.org";
          "site=download.docker.com";
          "site=linux.dropbox.com";
          "site=packages.adoptium.net";
          "site=packages.microsoft.com";
          "site=packages.mozilla.org";
          "site=ppa.launchpadcontent.net";
          "site=releases.warp.dev";
          "site=repo.anaconda.com";
          "site=www.synaptics.com";
      };

- name: Exclude NVIDIA packages from unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-nvidia
    mode: '0644'
    content: |
      Unattended-Upgrade::Package-Blacklist {
          "^(lib)?nvidia";
          "^cuda";
          "^libcuda";
          "^libcu(blas|dnn|fft|file|pti|rand|solver|sparse)";
          "^libnpp";
          "^libnv(fatbin|jitlink|jpeg|ptxcompiler|rtc|toolsext|vm)";
          "^libxnvctrl";
          "^nsight";
          "^gds-tools";
          "^linux-.*-nvidia";
          "^xserver-xorg-video-nvidia";
      };
