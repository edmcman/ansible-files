- name: Select git-flow-next architecture
  ansible.builtin.set_fact:
    git_flow_next_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, '') }}"

- name: Check git-flow-next architecture
  ansible.builtin.assert:
    that: git_flow_next_arch | length > 0
    fail_msg: 'git-flow-next does not support architecture {{ ansible_architecture }} in this role'

- name: Create git-flow-next cache directory
  ansible.builtin.file:
    path: '/var/cache/git-flow-next/{{ git_flow_next_version }}-{{ git_flow_next_arch }}'
    state: directory
    mode: '0755'

- name: Download git-flow-next release
  ansible.builtin.get_url:
    url: 'https://github.com/gittower/git-flow-next/releases/download/v{{ git_flow_next_version }}/git-flow-next-v{{ git_flow_next_version }}-linux-{{ git_flow_next_arch }}.tar.gz'
    dest: '/var/cache/git-flow-next/{{ git_flow_next_version }}-{{ git_flow_next_arch }}/git-flow-next-v{{ git_flow_next_version }}-linux-{{ git_flow_next_arch }}.tar.gz'
    checksum: 'sha256:https://github.com/gittower/git-flow-next/releases/download/v{{ git_flow_next_version }}/git-flow-next-v{{ git_flow_next_version }}-checksums.txt'
    mode: '0644'
  register: git_flow_next_archive
  when: not ansible_check_mode

- name: Extract git-flow-next
  ansible.builtin.unarchive:
    src: '{{ git_flow_next_archive.dest }}'
    dest: '/var/cache/git-flow-next/{{ git_flow_next_version }}-{{ git_flow_next_arch }}'
    remote_src: true
    creates: '/var/cache/git-flow-next/{{ git_flow_next_version }}-{{ git_flow_next_arch }}/git-flow'
  when: not ansible_check_mode

- name: Install git-flow-next
  ansible.builtin.copy:
    src: '/var/cache/git-flow-next/{{ git_flow_next_version }}-{{ git_flow_next_arch }}/git-flow'
    dest: /usr/local/bin/git-flow
    remote_src: true
    mode: '0755'
  when: not ansible_check_mode

- name: Verify git-flow-next
  ansible.builtin.command: /usr/local/bin/git-flow version
  register: git_flow_next_installed
  changed_when: false
  failed_when: git_flow_next_installed.rc != 0 or git_flow_next_version not in git_flow_next_installed.stdout or 'git-flow-next' not in git_flow_next_installed.stdout
  when: not ansible_check_mode

- name: Remove old git-flow package
  ansible.builtin.apt:
    name: git-flow
    state: absent
  when: not ansible_check_mode
