- name: Create conda key cache directory
  ansible.builtin.file:
    path: /var/cache/ansible-conda
    state: directory
    mode: '0755'

- name: Download conda apt key
  ansible.builtin.get_url:
    url: https://repo.anaconda.com/pkgs/misc/gpgkeys/anaconda.asc
    dest: /var/cache/ansible-conda/key.asc
    force: true
    mode: '0644'

- name: Verify conda apt key
  ansible.builtin.command: gpg --show-keys --with-colons /var/cache/ansible-conda/key.asc
  register: conda_key
  changed_when: false
  failed_when: conda_key.rc != 0 or '34161F5BF5EB1D4BFBBB8F0A8AEB4F8B29D82806' not in conda_key.stdout
  check_mode: false

- name: Install verified conda apt key
  ansible.builtin.copy:
    src: /var/cache/ansible-conda/key.asc
    dest: /usr/share/keyrings/conda-archive-keyring.asc
    remote_src: true
    mode: '0644'
  notify: Apt update

- name: Add conda apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/conda.list
    content: "deb [arch=amd64 signed-by=/usr/share/keyrings/conda-archive-keyring.asc] https://repo.anaconda.com/pkgs/misc/debrepo/conda stable main\n"
    mode: '0644'
  notify: Apt update

- meta: flush_handlers

- name: Install conda
  apt:
    name: conda
